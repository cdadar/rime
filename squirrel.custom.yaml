patch:
  # 鼠须管实际读的是 squirrel.yaml 的 style，所以字体写在这里。
  # 逗号分隔 = 字体回退链（CoreText cascadeList，顺序即优先级）；名字解析不到会被静默跳过，
  # 所以必须写本机真实存在的字体名（可用 fc-match "名字" 验）。
  # Plangothic P1 兜 Ext B–F、P2 兜 Ext G 以上 —— macOS 自带字体没有 Ext B 字形，缺了这两段
  # 生僻字会落到 /System/Library/Fonts/LastResort.otf（方块）。
  style/font_face: "LXGW WenKai, Plangothic P1, Plangothic P2"
  style/font_point: 13
  style/label_font_face: "Menlo"          # 序号（12345）用等宽
  style/comment_font_face: "LXGW WenKai"  # 注释 / 拼音提示

  app_options:
    org.gnu.Emacs:
      ascii_mode: true

    com.apple.Xcode:
      ascii_mode: true
      ascii_esc: true

    com.jetbrains.pycharm:
      ascii_mode: true
      ascii_esc: true

    com.jetbrains.WebStorm:
      ascii_mode: true
      ascii_esc: true

    com.google.android.studio:
      ascii_mode: true
      ascii_esc: true

    com.jetbrains.CLion:
      ascii_mode: true
      ascii_esc: true

    com.jetbrains.datagrip:
      ascii_mode: true
      ascii_esc: true

    com.jetbrains.goland:
      ascii_mode: true
      ascii_esc: true

    com.jetbrains.intellij:
      ascii_mode: true
      ascii_esc: true

    com.googlecode.iterm2:
      ascii_mode: true

    com.alfredapp.Alfred: {}
