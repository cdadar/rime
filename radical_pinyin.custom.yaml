# radical_pinyin.custom.yaml
# 部件拆字反查的拼写规则。节点名在 radical_pinyin.schema.yaml 里，必须带文件前缀，
# 且名字是 algebra_double_pinyin_flypy（不是 algebra_flypy）——写错会导致整份 patch 被静默丢弃。
patch:
  speller/algebra:
    __include: radical_pinyin.schema.yaml:/algebra_double_pinyin_flypy
    # __include: radical_pinyin.schema.yaml:/algebra_rime_ice             # 全拼
    # __include: radical_pinyin.schema.yaml:/algebra_double_pinyin        # 自然码双拼
    # __include: radical_pinyin.schema.yaml:/algebra_double_pinyin_mspy   # 微软双拼
    # __include: radical_pinyin.schema.yaml:/algebra_double_pinyin_sogou  # 搜狗双拼
    # __include: radical_pinyin.schema.yaml:/algebra_double_pinyin_abc    # 智能 ABC
    # __include: radical_pinyin.schema.yaml:/algebra_double_pinyin_ziguang # 紫光双拼
    # __include: radical_pinyin.schema.yaml:/algebra_double_pinyin_jiajia # 拼音加加
