patch:
  # 鼠须管实际读的是 squirrel.yaml 的 style，所以字体写在这里。
  # 逗号分隔 = 字体回退链（CoreText cascadeList，顺序即优先级）；名字解析不到会被静默跳过，
  # 所以必须写本机真实存在的字体名（可用 fc-match "名字" 验）。
  # 逐层：文楷（BMP+Ext A，楷体）→ HanaMinB / 花園明朝 B（Ext B–F，明朝体，楷→明气质接近）
  # → 遍黑体 P2（Ext G/H）。不装 HanaMinB 的话 Ext B 会用黑体（P1），楷/黑混排看着割裂。
  style/font_face: "LXGW WenKai, HanaMinB, Plangothic P1, Plangothic P2"
  style/font_point: 13
  style/label_font_face: "Menlo"          # 序号（12345）用等宽
  style/comment_font_face: "LXGW WenKai"  # 注释 / 拼音提示

  app_options:
    org.gnu.Emacs:
      ascii_mode: true

    com.apple.Xcode:
      ascii_mode: true
      ascii_esc: true

    com.jetbrains.pycharm:
      ascii_mode: true
      ascii_esc: true

    com.jetbrains.WebStorm:
      ascii_mode: true
      ascii_esc: true

    com.google.android.studio:
      ascii_mode: true
      ascii_esc: true

    com.jetbrains.CLion:
      ascii_mode: true
      ascii_esc: true

    com.jetbrains.datagrip:
      ascii_mode: true
      ascii_esc: true

    com.jetbrains.goland:
      ascii_mode: true
      ascii_esc: true

    com.jetbrains.intellij:
      ascii_mode: true
      ascii_esc: true

    com.googlecode.iterm2:
      ascii_mode: true

    com.alfredapp.Alfred: {}
